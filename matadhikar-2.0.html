<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MatAdhikar — Election Process Educator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0a0a0f;
    --paper: #f5f0e8;
    --saffron: #ff6b1a;
    --saffron-glow: #ff6b1a44;
    --green: #00c896;
    --green-glow: #00c89644;
    --blue: #4a9eff;
    --purple: #b06aff;
    --yellow: #ffe135;
    --red: #ff3b5c;
    --card-bg: #13131f;
    --card-border: #2a2a3d;
    --muted: #8888aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  @keyframes floatUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
  @keyframes pulse-ring { 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.05); opacity:.8; } }
  @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
  @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
  @keyframes vvpat-emerge { 0%{height:0;opacity:0} 30%{opacity:1} 100%{height:120px;opacity:1} }
  @keyframes confetti-fall {
    0%{transform:translateY(-10px) rotate(0deg); opacity:1}
    100%{transform:translateY(100vh) rotate(720deg); opacity:0}
  }
  @keyframes glow-pulse { 0%,100%{box-shadow:0 0 20px var(--saffron-glow)} 50%{box-shadow:0 0 40px var(--saffron),0 0 80px var(--saffron-glow)} }
  @keyframes neon-pulse { 0%,100%{box-shadow:0 0 10px #ff6ec7,0 0 20px #ff6ec744} 50%{box-shadow:0 0 20px #ff6ec7,0 0 40px #ff6ec7,0 0 60px #ff6ec744} }
  @keyframes score-count { from{transform:scale(1.3);color:#ffcc00} to{transform:scale(1);} }

  .float-up { animation: floatUp .5s ease forwards; }
  .fade-in { animation: fadeIn .4s ease forwards; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: var(--saffron); border-radius: 2px; }

  .ticker-wrap { overflow: hidden; background: var(--saffron); padding: 10px 0; }
  .ticker-inner { display: flex; animation: ticker 25s linear infinite; width: max-content; }
  .ticker-item { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink); font-weight: 700; padding: 0 40px; white-space: nowrap; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,107,26,.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .btn-primary {
    background: var(--saffron);
    color: var(--ink);
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    letter-spacing: .5px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--saffron-glow); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-ghost {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--card-border);
    border-radius: 50px;
    padding: 12px 28px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .btn-ghost:hover { border-color: var(--saffron); background: var(--saffron-glow); }

  .btn-green {
    background: var(--green);
    color: var(--ink);
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .btn-green:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--green-glow); }

  /* ── NEW HERO BUTTONS ── */
  .btn-vice-city {
    background: linear-gradient(135deg, #1a0010, #0a0a1a);
    color: #ff6ec7;
    border: 1.5px solid #ff6ec7;
    border-radius: 50px;
    padding: 13px 28px;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1.5px;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .btn-vice-city:hover {
    background: linear-gradient(135deg, #2a0020, #1a0a2a);
    animation: neon-pulse 1s ease infinite;
    transform: translateY(-2px);
  }

  .btn-civic-score {
    background: linear-gradient(135deg, #001a0a, #0a1a1a);
    color: #00ffcc;
    border: 1.5px solid #00ffcc;
    border-radius: 50px;
    padding: 13px 28px;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1.5px;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .btn-civic-score:hover {
    background: linear-gradient(135deg, #002a14, #0a2a2a);
    box-shadow: 0 0 20px #00ffcc44, 0 0 40px #00ffcc22;
    transform: translateY(-2px);
  }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(8px);
    z-index: 9999;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-inner {
    width: 100%;
    max-width: 780px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    margin: auto;
    animation: fadeIn .3s ease;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .modal-close:hover { background: rgba(255,60,60,0.3); }

  /* ── CIVIC SCORE CALCULATOR ── */
  .score-question {
    background: #0d0d1a;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: border-color .2s;
  }
  .score-question:focus-within { border-color: var(--saffron); }
  .score-q-text { font-size: 13px; font-weight: 600; color: var(--paper); margin-bottom: 10px; line-height: 1.5; }
  .score-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .score-opt {
    padding: 7px 16px;
    border-radius: 99px;
    border: 1px solid var(--card-border);
    background: #1a1a2e;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .score-opt:hover { border-color: var(--saffron); color: var(--paper); }
  .score-opt.selected { border-color: var(--saffron); background: var(--saffron-glow); color: var(--saffron); font-weight: 700; }
  .score-opt.selected-green { border-color: var(--green); background: var(--green-glow); color: var(--green); font-weight: 700; }
  .score-opt.selected-blue { border-color: var(--blue); background: rgba(74,158,255,.15); color: var(--blue); font-weight: 700; }

  .score-result-bar { height: 8px; border-radius: 4px; background: #1a1a2e; overflow: hidden; margin: 6px 0; }
  .score-result-fill { height: 8px; border-radius: 4px; transition: width 1s ease; }

  .quiz-option {
    display: block;
    width: 100%;
    text-align: left;
    background: #1a1a2e;
    border: 2px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 20px;
    color: var(--paper);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .2s, background .2s, transform .15s;
    margin-bottom: 10px;
  }
  .quiz-option:hover { border-color: var(--blue); background: rgba(74,158,255,.1); transform: translateX(4px); }
  .quiz-option.correct { border-color: var(--green); background: var(--green-glow); }
  .quiz-option.wrong { border-color: var(--red); background: rgba(255,59,92,.15); }
  .quiz-option:disabled { cursor: default; transform: none; }

  .progress-bar-bg { background: #1a1a2e; border-radius: 999px; height: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--saffron), var(--yellow)); border-radius: 999px; transition: width .5s ease; }

  .phase-step {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: default;
    opacity: .5;
    transition: opacity .3s;
    font-family: 'Syne', sans-serif;
  }
  .phase-step.active { opacity: 1; background: rgba(255,107,26,.15); color: var(--saffron); }
  .phase-step.done { opacity: .8; color: var(--green); }

  .evm-machine {
    background: linear-gradient(145deg, #1e2a4a, #162040);
    border: 3px solid #2a4080;
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 340px;
    margin: 0 auto;
    box-shadow: 0 20px 60px rgba(0,0,50,.5);
    position: relative;
  }
  .evm-screen {
    background: #001a00;
    border: 2px solid #00aa00;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    font-family: 'Space Mono', monospace;
    color: #00ff00;
    font-size: 13px;
    margin-bottom: 24px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 10px #00ff00;
  }
  .evm-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #0d1b3e, #162040);
    border: 2px solid #2a4080;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    color: var(--paper);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
  }
  .evm-btn:hover:not(:disabled) { border-color: var(--blue); background: rgba(74,158,255,.15); }
  .evm-btn:disabled { opacity: .5; cursor: not-allowed; }
  .evm-btn-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }

  .vvpat-box {
    background: linear-gradient(145deg, #2a1a0a, #1a1205);
    border: 2px solid #8b6914;
    border-radius: 16px;
    padding: 20px;
    max-width: 280px;
    margin: 20px auto;
    position: relative;
    overflow: hidden;
  }
  .vvpat-slip {
    background: white;
    color: #111;
    border-radius: 8px;
    padding: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    overflow: hidden;
    transition: all .3s ease;
  }
  .vvpat-slip.emerging { animation: vvpat-emerge .4s ease forwards; }

  @keyframes vvpat-emerge { 0%{height:0;opacity:0} 30%{opacity:1} 100%{height:120px;opacity:1} }

  .count-stage {
    padding: 16px 20px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: #0d0d1a;
    margin-bottom: 12px;
    transition: all .4s ease;
    opacity: .4;
  }
  .count-stage.active { opacity: 1; border-color: var(--saffron); background: rgba(255,107,26,.08); }
  .count-stage.done { opacity: 1; border-color: var(--green); background: rgba(0,200,150,.08); }

  .cert-container {
    background: linear-gradient(135deg, #0a0a1a, #1a0a0a);
    border: 3px solid transparent;
    background-clip: padding-box;
    border-radius: 24px;
    padding: 48px 40px;
    position: relative;
    overflow: hidden;
    text-align: center;
    max-width: 640px;
    margin: 0 auto;
  }
  .cert-container::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: linear-gradient(135deg, var(--saffron), var(--green), var(--blue), var(--purple));
    border-radius: 26px;
    z-index: -1;
  }
  .cert-seal {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--saffron), var(--yellow));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 20px;
    animation: glow-pulse 2s ease infinite;
  }

  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
    z-index: 999;
    pointer-events: none;
  }

  .tab-nav {
    display: flex;
    gap: 4px;
    background: #0d0d1a;
    border-radius: 16px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 16px;
    border-radius: 12px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .5px;
  }
  .tab-btn.active { background: var(--saffron); color: var(--ink); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    letter-spacing: .5px;
  }
  .badge-saffron { background: var(--saffron-glow); color: var(--saffron); border: 1px solid var(--saffron); }
  .badge-green { background: var(--green-glow); color: var(--green); border: 1px solid var(--green); }
  .badge-blue { background: rgba(74,158,255,.15); color: var(--blue); border: 1px solid var(--blue); }
  .badge-purple { background: rgba(176,106,255,.15); color: var(--purple); border: 1px solid var(--purple); }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--card-border);
    border-top-color: var(--saffron);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto;
  }

  .shimmer {
    background: linear-gradient(90deg, #1a1a2e 25%, #252540 50%, #1a1a2e 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }

  .hero-headline {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(36px, 6vw, 72px);
    line-height: 1.05;
    letter-spacing: -1px;
  }
  .gradient-text {
    background: linear-gradient(90deg, var(--saffron), var(--yellow), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width:640px) { .grid-2 { grid-template-columns: 1fr; } }

  /* ── VICE CITY GAME EMBED ── */
  #vc-game-root { background: #0a0a0f; font-family: 'Share Tech Mono', monospace; }
  .vc-font { font-family: 'Orbitron', monospace; }
</style>
</head>

// VICE CITY GAME COMPONENT (inline)
// ══════════════════════════════════════════
function ViceCityGame({ onClose }) {
  const canvasRef = useRef(null);
  const [gs, setGs] = useState({ chapter: -1, rep: 0, knowledge: 0, wanted: 0, day: 1, choices: [], evmVoted: false });
  const [phase, setPhase] = useState('title'); // title | game | end
  const [feedback, setFeedback] = useState(null);
  const [aiText, setAiText] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [showNext, setShowNext] = useState(false);
  const [vvpatCountdown, setVvpatCountdown] = useState(null);

  const chapters = [
    { id:1, title:"MISSION 1: BACK ON THE STREETS", sub:"Registration is power", day:1, loc:"LITTLE HAVANA — TOMMY'S HOOD", npc:{av:"RO",nm:"ROSIE",role:"TOMMY'S CONTACT",bg:"#2a1a00"}, speech:"Tommy, you just got out and already you're useless. Election's in 7 days — Sonny's got his boy Harris running for Mayor. You ain't even registered to vote, are ya? Start there. The registrar's office is open till midnight.", choices:[{t:"Head to the registrar. Register to vote tonight.",delta:{rep:15,know:20},good:true,fb:"MISSION COMPLETE. Registration is your entry ticket — no registration, no voice."},{t:"Tell Rosie voting is rigged anyway.",delta:{rep:-10,know:0},good:false,fb:"BUSTED. Sonny's counting on people thinking that."},{t:"Ask what the registration deadline actually is.",delta:{rep:10,know:25},good:true,fb:"SMART MOVE. Deadline is 30 days before the election. You need ID and your address."}] },
    { id:2, title:"MISSION 2: THE DEBATES DON'T LIE", sub:"Know your candidates", day:3, loc:"VICE CITY CONVENTION CENTER", npc:{av:"KP",nm:"KENT PAUL",role:"JOURNALIST — VCNEWS",bg:"#001a14"}, speech:"Tommy! You watching the debate? Harris is promising a new stadium — paid for by YOUR taxes. Rivera's talking about fixing the water system in your neighborhood. Know the difference before you mark that ballot.", choices:[{t:"Watch the full debate. Research both platforms.",delta:{rep:20,know:30},good:true,fb:"MISSION COMPLETE. Harris gets money from Sonny's real estate company. Rivera is funded by the teachers' union."},{t:"Only listen to Harris — he sounds more confident.",delta:{rep:0,know:5},good:false,fb:"DANGEROUS PLAY. Charisma isn't policy."},{t:"Look up both candidates' voting records online.",delta:{rep:15,know:35},good:true,fb:"CLEAN MOVE. Past actions predict future ones — always check the record."}] },
    { id:3, title:"MISSION 3: DISINFORMATION BOULEVARD", sub:"Don't let them play you", day:5, loc:"OCEAN DRIVE — TOMMY'S CAR", npc:{av:"LC",nm:"LANCE",role:"TOMMY'S PARTNER",bg:"#1a0010"}, speech:"Yo Tommy, someone texted me saying the election got CANCELLED because of fraud. My cousin already decided not to vote. This stinks like Sonny's crew to me, man.", choices:[{t:"Tell Lance to check the official election commission website.",delta:{rep:20,know:25},good:true,fb:"WISE MOVE. The city site confirms: election ON, Rivera ON ballot. Official sources only."},{t:"Forward the text to everyone — better safe than sorry.",delta:{rep:-25,know:0},good:false,fb:"YOU GOT PLAYED. You just became Sonny's unpaid propaganda agent."},{t:"Call the voter hotline to verify, then correct the record.",delta:{rep:30,know:20},good:true,fb:"HERO MOVE. You countered a voter suppression campaign. This is civic action."}] },
    { id:4, title:"MISSION 4: ELECTION DAY", sub:"This is what it's all for", day:7, loc:"POLLING STATION #7 — LITTLE HAVANA", npc:{av:"PW",nm:"POLL WORKER",role:"OFFICIAL STATION STAFF",bg:"#001500"}, speech:"Mr. Vega, I'll need your voter registration confirmation or a valid photo ID. Once I check you in, you'll get your official ballot. Private booth — no cameras, no phones. Take your time. This is your constitutional right.", choices:[{t:"Show ID, check in properly, read the FULL ballot, then vote.",delta:{rep:30,know:20},good:true,fb:"MISSION COMPLETE. You noticed ballot measures for school funding below the mayor's race. A complete ballot."},{t:"Try to photo your marked ballot for proof.",delta:{rep:-10,know:5},good:false,fb:"BUSTED. Photographing marked ballots is illegal in most states."},{t:"Rush through — just mark the mayor and leave.",delta:{rep:10,know:10},good:false,fb:"YOU MISSED SOMETHING. Three more measures on the ballot. A rushed vote is an incomplete vote."}] }
  ];

  const currentChapter = gs.chapter >= 0 && gs.chapter < chapters.length ? chapters[gs.chapter] : null;

  useEffect(() => {
    if (canvasRef.current && currentChapter) drawScene(currentChapter.id);
  }, [gs.chapter]);

  function drawScene(chId) {
    const c = canvasRef.current; if(!c) return;
    const ctx = c.getContext('2d');
    const W = c.width = c.offsetWidth || 680, H = 160;
    c.height = H;
    const palettes = {
      1:{sky:'#080810',road:'#ff6ec7'},
      2:{sky:'#050818',road:'#00ffcc'},
      3:{sky:'#100508',road:'#ff3388'},
      4:{sky:'#050f05',road:'#00ff88'}
    };
    const pal = palettes[chId] || palettes[1];
    ctx.fillStyle = pal.sky; ctx.fillRect(0,0,W,H);
    const bldgs = [
      {x:0,w:70,h:80,fill:'#1a0a05'},{x:75,w:90,h:110,fill:'#120820'},
      {x:175,w:55,h:70,fill:'#0a1520'},{x:240,w:120,h:130,fill:'#150515'},
      {x:370,w:80,h:90,fill:'#0a1a0a'},{x:460,w:60,h:75,fill:'#1a1505'},
      {x:530,w:100,h:100,fill:'#10101a'},{x:640,w:80,h:85,fill:'#1a0505'}
    ];
    bldgs.forEach(b=>{
      ctx.fillStyle=b.fill; ctx.fillRect(b.x,H-b.h,b.w,b.h);
      ctx.strokeStyle=pal.road+'44'; ctx.lineWidth=0.5; ctx.strokeRect(b.x,H-b.h,b.w,b.h);
      for(let i=0;i<3;i++) for(let j=0;j<4;j++){
        ctx.fillStyle=Math.random()>0.4?pal.road+'33':'#0d0d1a';
        ctx.fillRect(b.x+5+i*20,H-b.h+8+j*18,8,10);
      }
    });
    ctx.fillStyle='#111'; ctx.fillRect(0,H-18,W,18);
    ctx.strokeStyle=pal.road; ctx.lineWidth=1; ctx.strokeRect(0,H-1,W,1);
    ctx.fillStyle='#1a0a0a'; ctx.fillRect(40,H-18,50,18);
    ctx.strokeStyle='#ff6ec7'; ctx.lineWidth=1; ctx.strokeRect(40,H-18,50,18);
    ctx.font='bold 7px Orbitron,monospace'; ctx.fillStyle='#ff6ec7'; ctx.textAlign='left';
    ctx.fillText(currentChapter?.loc?.split('—')[0]||'VICE CITY',12,H-6);
  }

  async function pickChoice(chapIdx, choiceIdx) {
    const ch = chapters[chapIdx];
    const c = ch.choices[choiceIdx];
    setGs(prev => ({
      ...prev,
      rep: Math.max(0, Math.min(100, prev.rep + c.delta.rep)),
      knowledge: Math.min(100, prev.knowledge + c.delta.know),
      wanted: c.good ? prev.wanted : Math.min(3, prev.wanted + 1),
      choices: [...prev.choices, {good: c.good}]
    }));
    setFeedback({text: c.fb, good: c.good});
    setAiLoading(true);
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:`GTA Vice City election game. Tommy Vega chose: "${c.t}". Result: ${c.good?'good civic choice':'bad choice'}. Write 2 gritty noir sentences (max 30 words). Vice City street language. Tease next mission.`}]}],generationConfig:{maxOutputTokens:60,temperature:0.9}})
      });
      const d = await r.json();
      setAiText(d.candidates?.[0]?.content?.parts?.[0]?.text || '');
    } catch(e) { setAiText(''); }
    setAiLoading(false);
    setShowNext(true);
  }

  function nextChapter() {
    setFeedback(null); setAiText(''); setShowNext(false);
    if (gs.chapter + 1 >= chapters.length) {
      setPhase('end');
    } else {
      setGs(prev => ({...prev, chapter: prev.chapter + 1, day: chapters[prev.chapter + 1]?.day || prev.day}));
    }
  }

  function startGame() {
    setGs({ chapter: 0, rep: 0, knowledge: 0, wanted: 0, day: 1, choices: [] });
    setPhase('game'); setFeedback(null); setAiText(''); setShowNext(false);
  }

  const total = gs.rep + gs.knowledge;
  const pct = Math.round((total / 200) * 100);
  let rank = pct >= 80 ? 'LEGEND OF VICE CITY' : pct >= 55 ? 'STREET SOLDIER' : 'SMALL TIME';

  return (
    <div style={{background:'#0a0a1a',minHeight:'500px',color:'#fff',fontFamily:"'Share Tech Mono',monospace"}}>
      {/* Header */}
      <div style={{background:'#000',padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid #ff6ec7'}}>
        <div style={{fontFamily:'Orbitron,monospace',fontSize:14,fontWeight:700,color:'#ff6ec7',letterSpacing:2}}>VOTE CITY</div>
        {phase==='game' && (
          <div style={{display:'flex',gap:16,alignItems:'center'}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:9,color:'#ff6ec7',letterSpacing:1}}>REP</div>
              <div style={{fontFamily:'Orbitron,monospace',fontSize:12,color:'#ff6ec7'}}>{gs.rep}</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:9,color:'#00ffcc',letterSpacing:1}}>KNOW</div>
              <div style={{fontFamily:'Orbitron,monospace',fontSize:12,color:'#00ffcc'}}>{gs.knowledge}</div>
            </div>
            <div style={{fontSize:9,color:'#555'}}>DAY {gs.day}/7</div>
          </div>
        )}
      </div>

      {phase === 'title' && (
        <div style={{textAlign:'center',padding:'2rem 1rem'}}>
          <div style={{fontFamily:'Orbitron,monospace',fontSize:28,fontWeight:900,color:'#ff6ec7',letterSpacing:4,marginBottom:8}}>VOTE CITY</div>
          <div style={{fontFamily:'Orbitron,monospace',fontSize:11,color:'#00ffcc',letterSpacing:6,marginBottom:16}}>ELECTION STORY MODE</div>
          <p style={{fontSize:12,color:'#666',maxWidth:380,margin:'0 auto 24px',lineHeight:1.8}}>
            You are TOMMY VEGA — just got out, rolling into Vice City. Election's in 7 days. Corrupt boss SONNY CORRADO wants his puppet Mayor HARRIS in power. Navigate it all — register, research, fight disinfo, vote.
          </p>
          <button onClick={startGame} style={{background:'none',border:'2px solid #ff6ec7',color:'#ff6ec7',fontFamily:'Orbitron,monospace',fontSize:11,fontWeight:700,letterSpacing:4,padding:'12px 28px',cursor:'pointer'}}>[ BEGIN MISSION ]</button>
        </div>
      )}

      {phase === 'game' && currentChapter && (
        <div>
          <canvas ref={canvasRef} style={{width:'100%',height:160,display:'block',background:'#0a0f0a'}} />
          <div style={{background:'#000',borderTop:'2px solid #ff6ec7',padding:'8px 14px'}}>
            <div style={{fontFamily:'Orbitron,monospace',fontSize:9,color:'#555',letterSpacing:3,marginBottom:4}}>CHAPTER {gs.chapter+1}/4 · {currentChapter.title}</div>
            <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
              <div style={{width:36,height:36,borderRadius:4,border:'1px solid #ff6ec7',background:currentChapter.npc.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#ff6ec7',fontFamily:'Orbitron,monospace',flexShrink:0}}>{currentChapter.npc.av}</div>
              <div>
                <div style={{fontFamily:'Orbitron,monospace',fontSize:9,color:'#ff6ec7',letterSpacing:2}}>{currentChapter.npc.nm}</div>
                <div style={{fontSize:8,color:'#444',marginBottom:4}}>{currentChapter.npc.role}</div>
                <div style={{fontSize:11,color:'#ddd',lineHeight:1.7}}>{currentChapter.speech}</div>
              </div>
            </div>
          </div>
          {feedback && (
            <div style={{padding:'10px 14px',fontSize:11,lineHeight:1.7,background:feedback.good?'#000f05':'#0f0000',borderTop:`2px solid ${feedback.good?'#00ff88':'#ff3333'}`,color:feedback.good?'#00ff88':'#ff4444'}}>
              <strong style={{fontFamily:'Orbitron,monospace',fontSize:9,letterSpacing:2}}>{feedback.good?'✓ MISSION UPDATE':'✗ HEAT LEVEL UP'}</strong><br/><br/>
              {feedback.text}
              {aiText && <div style={{marginTop:8,color:'#ff6ec7',fontStyle:'italic',fontSize:10}}>{aiText}</div>}
              {aiLoading && <div style={{color:'#ff6ec7',fontSize:10,marginTop:4}}>Generating story beat...</div>}
            </div>
          )}
          {!feedback && (
            <div style={{background:'#06060f',padding:'10px 14px',borderTop:'1px solid #1a1a2a'}}>
              {currentChapter.choices.map((c, i) => (
                <div key={i} onClick={() => pickChoice(gs.chapter, i)} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 10px',marginBottom:6,border:'1px solid #222',borderRadius:3,cursor:'pointer',background:'#0a0a18',transition:'all .15s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor='#ff6ec7';e.currentTarget.style.background='#1a0010';}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor='#222';e.currentTarget.style.background='#0a0a18';}}>
                  <div style={{width:22,height:22,borderRadius:3,background:'#ff6ec7',color:'#000',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontFamily:'Orbitron,monospace'}}>{String.fromCharCode(65+i)}</div>
                  <div style={{fontSize:12,color:'#ccc'}}>{c.t}</div>
                </div>
              ))}
            </div>
          )}
          {showNext && (
            <div style={{padding:'0 14px 14px'}}>
              <button onClick={nextChapter} style={{display:'block',width:'100%',padding:10,background:'#ff6ec7',color:'#000',fontFamily:'Orbitron,monospace',fontSize:11,fontWeight:700,letterSpacing:3,border:'none',cursor:'pointer'}}>
                {gs.chapter + 1 < chapters.length ? '[ NEXT MISSION ]' : '[ SEE YOUR ENDING ]'}
              </button>
            </div>
          )}
        </div>
      )}

      {phase === 'end' && (
        <div style={{textAlign:'center',padding:'2rem 1rem'}}>
          <div style={{width:80,height:80,borderRadius:'50%',background:'#001a08',border:'2px solid #ffcc00',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',fontSize:28}}>🗳️</div>
          <div style={{fontFamily:'Orbitron,monospace',fontSize:20,fontWeight:900,color:'#ffcc00',letterSpacing:3,marginBottom:8}}>{rank}</div>
          <div style={{fontFamily:'Orbitron,monospace',fontSize:11,color:'#00ffcc',letterSpacing:2,marginBottom:16}}>REP: {gs.rep} / KNOWLEDGE: {gs.knowledge} / SCORE: {pct}%</div>
          <button onClick={startGame} style={{background:'none',border:'2px solid #ff6ec7',color:'#ff6ec7',fontFamily:'Orbitron,monospace',fontSize:11,fontWeight:700,letterSpacing:4,padding:'10px 24px',cursor:'pointer',marginRight:8}}>[ PLAY AGAIN ]</button>

}

// CIVIC SCORE CALCULATOR
// ══════════════════════════════════════════
function CivicScoreCalc({ onClose }) {
  const questions = [
    { q: "Are you registered to vote?", opts: ["Yes, registered", "Not yet", "Don't know", "Not eligible"], scores: [20, 0, 5, 10], color: 'saffron' },
    { q: "Have you voted in the last election?", opts: ["Yes, voted", "Missed it", "First-time voter", "Was too young"], scores: [25, 0, 15, 10], color: 'green' },
    { q: "How do you research candidates?", opts: ["Full policy research", "News headlines", "Social media", "I don't research"], scores: [20, 12, 5, 0], color: 'blue' },
    { q: "Do you know your constituency & candidate names?", opts: ["Yes, both", "Constituency only", "Neither", "Vaguely"], scores: [15, 8, 0, 5], color: 'saffron' },
    { q: "Do you fact-check election news before sharing?", opts: ["Always", "Sometimes", "Rarely", "Never"], scores: [15, 8, 3, 0], color: 'green' },
    { q: "Do you know what NOTA means?", opts: ["Yes — None Of The Above", "Heard of it", "No idea", "Partially"], scores: [5, 3, 0, 2], color: 'blue' },
  ];

  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);
  const [aiDebrief, setAiDebrief] = useState('');
  const [aiLoading, setAiLoading] = useState(false);

  const total = 100;
  const answered = Object.keys(answers).length;
  const currentScore = Object.entries(answers).reduce((sum, [qi, oi]) => sum + (questions[parseInt(qi)]?.scores[parseInt(oi)] || 0), 0);

  async function calcResult() {
    const score = currentScore;
    let rank, color, msg;
    if (score >= 80) { rank = "Civic Champion 🏆"; color = "#00ffcc"; msg = "You are an informed, active participant in democracy. Exceptional civic awareness!"; }
    else if (score >= 60) { rank = "Engaged Citizen 🗳️"; color = "#4a9eff"; msg = "You're doing well! A few areas to sharpen — candidate research and fact-checking."; }
    else if (score >= 35) { rank = "Civic Learner 📖"; color = "#ff6b1a"; msg = "Good start! Focus on registration, research, and verifying election news."; }
    else { rank = "Democracy Rookie 🌱"; color = "#b06aff"; msg = "Everyone starts somewhere! The MatAdhikar curriculum is exactly what you need."; }
    setResult({ score, rank, color, msg });
    setAiLoading(true);
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:`Civic score calculator result. User scored ${score}/100 on Indian election civic awareness quiz. Rank: ${rank}. Write a warm, specific 2-sentence personalized debrief. Mention 1 strength and 1 thing to improve. End with an encouraging line about Indian democracy. Max 50 words.`}]}],generationConfig:{maxOutputTokens:80,temperature:0.8}})
      });
      const d = await r.json();
      setAiDebrief(d.candidates?.[0]?.content?.parts?.[0]?.text || '');
    } catch(e) {}
    setAiLoading(false);
  }

  const colorMap = { saffron: 'var(--saffron)', green: 'var(--green)', blue: 'var(--blue)' };

  return (
    <div style={{background:'var(--card-bg)',borderRadius:20,overflow:'hidden'}}>
      {/* Header */}
      <div style={{background:'linear-gradient(135deg,#001a0a,#0a1a1a)',padding:'20px 24px',borderBottom:'1px solid var(--card-border)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:6}}>
          <div style={{width:40,height:40,borderRadius:'50%',background:'linear-gradient(135deg,var(--green),var(--blue))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>📊</div>
          <div>
            <div style={{fontFamily:'Orbitron,monospace',fontSize:13,fontWeight:700,color:'#00ffcc',letterSpacing:2}}>CIVIC SCORE CALCULATOR</div>
            <div style={{fontSize:11,color:'var(--muted)'}}>Powered by Gemini AI · Indian Elections</div>
          </div>
        </div>
        {/* Live score bar */}
        <div style={{marginTop:12}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:11,color:'var(--muted)'}}>Live Score</span>
            <span style={{fontFamily:'Orbitron,monospace',fontSize:13,fontWeight:700,color:'#00ffcc'}}>{currentScore} / 100</span>
          </div>
          <div className="progress-bar-bg">
            <div className="progress-bar-fill" style={{width:`${currentScore}%`,background:'linear-gradient(90deg,#00c896,#4a9eff)'}} />
          </div>
          <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>{answered}/{questions.length} questions answered</div>
        </div>
      </div>

      <div style={{padding:'20px 24px',maxHeight:'55vh',overflowY:'auto'}}>
        {!result ? (
          <>
            {questions.map((q, qi) => (
              <div key={qi} className="score-question">
                <div className="score-q-text">
                  <span style={{fontFamily:'Space Mono',fontSize:10,color:colorMap[q.color],marginRight:8}}>Q{qi+1}</span>
                  {q.q}
                </div>
                <div className="score-options">
                  {q.opts.map((opt, oi) => (
                    <button key={oi}
                      className={`score-opt ${answers[qi] === oi ? `selected-${q.color === 'saffron' ? '' : q.color}`.replace('selected-','selected') : ''}`}
                      style={answers[qi] === oi ? {borderColor: colorMap[q.color], background: colorMap[q.color]+'22', color: colorMap[q.color], fontWeight:700} : {}}
                      onClick={() => setAnswers(prev => ({...prev, [qi]: oi}))}>
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            ))}
            <button
              className="btn-green"
              disabled={answered < questions.length}
              onClick={calcResult}
              style={{width:'100%',marginTop:8,opacity:answered<questions.length?0.4:1}}>
              {answered < questions.length ? `Answer all ${questions.length - answered} remaining →` : '✨ Calculate My Civic Score →'}
            </button>
          </>
        ) : (
          <div style={{textAlign:'center'}}>
            {/* Donut score */}
            <div style={{position:'relative',width:120,height:120,margin:'0 auto 20px'}}>
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="50" fill="none" stroke="#1a1a2e" strokeWidth="10"/>
                <circle cx="60" cy="60" r="50" fill="none" stroke={result.color} strokeWidth="10"
                  strokeDasharray={`${result.score * 3.14} 314`}
                  strokeLinecap="round"
                  transform="rotate(-90 60 60)"
                  style={{transition:'stroke-dasharray 1s ease'}}/>
              </svg>
              <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>

                    <span style={{color:colorMap[q.color],fontFamily:'Space Mono',fontWeight:700}}>+{q.scores[answers[qi]]}</span>
                  </div>
                  <div className="score-result-bar">
                    <div className="score-result-fill" style={{width:`${(q.scores[answers[qi]]/Math.max(...q.scores))*100}%`,background:colorMap[q.color]}} />
                  </div>
                </div>
              ))}
            </div>
            {/* AI Debrief */}
            {aiLoading && <div className="spinner" style={{width:28,height:28,margin:'12px auto'}}/>}
            {aiDebrief && (
              <div style={{background:'rgba(0,200,150,0.08)',border:'1px solid var(--green)',borderRadius:12,padding:'14px 16px',marginBottom:16,textAlign:'left',borderLeft:'3px solid var(--green)'}}>
                <div style={{fontSize:10,color:'var(--green)',fontFamily:'Space Mono',letterSpacing:1,marginBottom:6}}>🤖 AI DEBRIEF</div>

            <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
              <button className="btn-primary" onClick={() => { setResult(null); setAnswers({}); setAiDebrief(''); }}>Recalculate →</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function WatchTab({ data }) {
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const intervalRef = useRef(null);
  const handlePlay = () => {
    if (playing) { clearInterval(intervalRef.current); setPlaying(false); return; }
    setPlaying(true); setProgress(0);
    intervalRef.current = setInterval(() => {
      setProgress(p => { if (p >= 100) { clearInterval(intervalRef.current); setPlaying(false); return 100; } return p + 0.5; });
    }, 150);
  };
  useEffect(() => () => clearInterval(intervalRef.current), []);
  return (
    <div className="fade-in">
      <div style={{ background: 'linear-gradient(135deg,#1a0a2e,#0a1a3e)', borderRadius: 16, padding: '40px 24px', marginBottom: 24, border: '1px solid var(--card-border)', textAlign: 'center' }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>🎬</div>
        <div style={{ fontFamily: 'Syne', fontSize: 18, fontWeight: 700, marginBottom: 8 }}>{data.title}</div>
        <div style={{ background: 'rgba(255,255,255,0.06)', borderRadius: 8, padding: '8px 16px', display: 'inline-block', fontSize: 12, color: 'var(--muted)', marginBottom: 20, fontFamily: 'Space Mono' }}>📺 {data.thumbnail_text}</div><br/>
        <button className="btn-primary" onClick={handlePlay} style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>{playing ? '⏸️ Pause' : '▶️ Play Demo'}</button>
        {(playing || progress > 0) && <div style={{ marginTop: 20 }}><div className="progress-bar-bg" style={{ width: '80%', margin: '0 auto' }}><div className="progress-bar-fill" style={{ width: `${progress}%` }} /></div></div>}
      </div>
      <div style={{ background: '#0d1a0d', border: '1px solid #00c89633', borderRadius: 14, padding: 20 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}><span className="badge badge-green">🎙️ AI VOICEOVER SCRIPT</span></div>
        <p style={{ fontSize: 14, lineHeight: 1.8, color: '#aad', fontStyle: 'italic' }}>"{data.voiceover_script}"</p>
      </div>
    </div>
  );
}

function QuizTab({ data, onCorrect }) {
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const handleSelect = (idx) => {
    if (answered) return;
    setSelected(idx); setAnswered(true);
    if (idx === data.correct_index) setTimeout(onCorrect, 1200);
  };
  const isCorrect = selected === data.correct_index;
  return (
    <div className="fade-in">
      <div style={{ marginBottom: 24 }}>
        <span className="badge badge-purple" style={{ marginBottom: 16, display: 'inline-flex' }}>🧠 KNOWLEDGE CHECK</span>
        <h3 style={{ fontFamily: 'Syne', fontSize: 18, fontWeight: 700, lineHeight: 1.4 }}>{data.question}</h3>
      </div>
      <div>
        {data.options.map((opt, idx) => (
          <button key={idx} className={`quiz-option ${answered && idx === data.correct_index ? 'correct' : ''} ${answered && idx === selected && !isCorrect ? 'wrong' : ''}`} onClick={() => handleSelect(idx)} disabled={answered}>
            <span style={{ marginRight: 12, fontFamily: 'Space Mono', fontSize: 12, color: 'var(--muted)' }}>{['A','B','C','D'][idx]}</span>
            {opt.replace(/^Option [ABCD]: /, '')}
          </button>
        ))}
      </div>
      {answered && (
        <div className="fade-in" style={{ marginTop: 20, padding: '16px 20px', borderRadius: 14, background: isCorrect ? 'var(--green-glow)' : 'rgba(255,59,92,.15)', border: `1px solid ${isCorrect ? 'var(--green)' : 'var(--red)'}` }}>
          <div style={{ fontWeight: 700, marginBottom: 6, color: isCorrect ? 'var(--green)' : 'var(--red)' }}>{isCorrect ? '✅ Correct!' : '❌ Not quite — the correct answer is highlighted above.'}</div>
          <p style={{ fontSize: 13, color: '#ccc', lineHeight: 1.6 }}>{data.explanation}</p>
          {!isCorrect && <button className="btn-ghost" style={{ marginTop: 12 }} onClick={() => { setSelected(null); setAnswered(false); }}>Try Again</button>}
        </div>
      )}
      {!answered && <p style={{ fontSize: 12, color: 'var(--muted)', marginTop: 16, textAlign: 'center', fontFamily: 'Space Mono' }}>⚡ You must answer correctly to unlock the next phase</p>}
    </div>
  );
}

function LearningModule({ phase, onPhaseComplete, completedPhases }) {
  const [activeTab, setActiveTab] = useState('learn');
  const [content, setContent] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [quizPassed, setQuizPassed] = useState(false);
  const [backendAvailable, setBackendAvailable] = useState(true);
  const phaseMeta = PHASES_META.find(p => p.id === phase);

  useEffect(() => { setLoading(true); setContent(null); setError(null); setQuizPassed(false); setActiveTab('learn'); loadContent(); }, [phase]);

  const loadContent = async () => {
    try {
      const res = await fetch(`${BACKEND_URL}/generate-phase`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phase }), signal: AbortSignal.timeout(10000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      setContent(data); setBackendAvailable(true);
    } catch (err) {
      setBackendAvailable(false);
      const fb = FALLBACK_CONTENT[phase];
      if (fb) setContent({ phase, phase_title: phaseMeta.title, phase_emoji: phaseMeta.emoji, ...fb });
      else setError('Failed to load content.');
    } finally { setLoading(false); }
  };

  return (
    <div>
      <div className="card" style={{ marginBottom: 20, borderColor: phaseMeta.color + '44' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <div style={{ width: 56, height: 56, borderRadius: '50%', background: `${phaseMeta.color}22`, border: `2px solid ${phaseMeta.color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24 }}>{phaseMeta.emoji}</div>
          <div>
            <div style={{ fontFamily: 'Space Mono', fontSize: 11, color: 'var(--muted)', letterSpacing: 2, marginBottom: 4 }}>PHASE {phase} / 5</div>
            <div style={{ fontFamily: 'Syne', fontSize: 20, fontWeight: 800 }}>{phaseMeta.title}</div>
            <div style={{ fontSize: 13, color: 'var(--muted)' }}>{phaseMeta.subtitle}</div>
          </div>
          {!backendAvailable && <span className="badge badge-saffron" style={{ marginLeft: 'auto' }}>📦 DEMO MODE</span>}
        </div>
      </div>
      <div className="tab-nav" style={{ marginBottom: 24 }}>
        {['learn','watch','quiz'].map(tab => <button key={tab} className={`tab-btn ${activeTab === tab ? 'active' : ''}`} onClick={() => setActiveTab(tab)}>{tab === 'learn' ? '📖 Learn' : tab === 'watch' ? '🎬 Watch' : '🧠 Quiz'}</button>)}
      </div>
      <div className="card" style={{ minHeight: 300, marginBottom: 24 }}>
        {loading ? <ContentSkeleton /> : error ? <div style={{ textAlign: 'center', padding: 40 }}><p style={{ color: 'var(--red)' }}>{error}</p><button className="btn-ghost" onClick={loadContent}>Try Again</button></div> : content ? (
          <>
            {activeTab === 'learn' && <LearnTab data={content.learn} />}
            {activeTab === 'watch' && <WatchTab data={content.watch} />}
            {activeTab === 'quiz' && <QuizTab data={content.quiz} onCorrect={() => setQuizPassed(true)} />}
          </>
        ) : null}
      </div>
      {content?.fun_fact && (
        <div className="card" style={{ marginBottom: 24, borderColor: 'var(--yellow)33', background: 'rgba(255,225,53,0.05)' }}>
          <span className="badge" style={{ background: 'rgba(255,225,53,0.15)', color: 'var(--yellow)', border: '1px solid var(--yellow)', marginBottom: 10, display: 'inline-flex' }}>💡 FUN FACT</span>
          <p style={{ fontSize: 14, color: '#ddd', lineHeight: 1.7 }}>{content.fun_fact}</p>
        </div>
      )}
      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
        <button className={quizPassed ? 'btn-green' : 'btn-primary'} disabled={!quizPassed} onClick={() => onPhaseComplete(phase)} style={{ opacity: quizPassed ? 1 : 0.4 }}>
          {quizPassed ? (phase === 5 ? '🎮 Launch EVM Simulator →' : `Next: Phase ${phase + 1} →`) : '🔒 Pass the Quiz to Continue'}
        </button>

    </div>
  );
}

    if (evmState !== 'ready') return;
    setVotedFor(id); setEvmState('voted'); setVvpatCountdown(7);

    { id:3, label:"🔍 VVPAT Verification", desc:"Randomly selecting 5 VVPATs for physical count matching" },

  return (
    <div className="fade-in">
      <div style={{ textAlign:'center', marginBottom:40 }}>
        <span className="badge badge-green" style={{ marginBottom:16, display:'inline-flex' }}>🎮 CAPSTONE: EVM SIMULATOR</span>

        <p style={{ color:'var(--muted)', fontSize:15 }}>Experience the complete voting process — just like election day!</p>
      </div>
      {(evmState === 'ready' || evmState === 'voted') && (

              <div style={{ fontFamily:'Space Mono', fontSize:10, color:'#4a9eff', letterSpacing:2, marginBottom:4 }}>ELECTION COMMISSION OF INDIA</div>
              <div style={{ fontFamily:'Space Mono', fontSize:9, color:'#666' }}>ELECTRONIC VOTING MACHINE</div>

            <div className="evm-screen">{evmState==='ready' ? <div><div style={{fontSize:11,marginBottom:4}}>READY TO VOTE</div><div style={{fontSize:24}}>▶</div><div style={{fontSize:10,marginTop:4,color:'#007700'}}>PRESS CANDIDATE BUTTON</div></div> : <div><div style={{fontSize:11,marginBottom:4,color:'#00ff00'}}>VOTE RECORDED ✓</div><div style={{fontSize:10}}>VVPAT PRINTING...</div></div>}</div>
            {candidates.map(c => (
              <button key={c.id} className="evm-btn" onClick={() => handleVote(c.id)} disabled={evmState!=='ready'}>
                <div style={{ display:'flex', alignItems:'center', gap:12 }}><span style={{fontSize:20}}>{c.symbol}</span><div><div style={{fontWeight:700,fontSize:13}}>{c.name}</div><div style={{fontSize:11,color:'var(--muted)'}}>{c.party}</div></div></div>
                <div className="evm-btn-circle" style={{ color:c.color, borderColor:c.color }}>{c.id}</div>
              </button>
            ))}
            <div style={{ marginTop:16, padding:'10px 12px', background:'#0a1020', borderRadius:8, textAlign:'center' }}><span style={{ fontFamily:'Space Mono', fontSize:9, color:'#333' }}>BHARAT ELECTRONICS LIMITED</span></div>
          </div>
          {evmState==='voted' && candidate && (
            <div className="vvpat-box">
              <div style={{ fontFamily:'Space Mono', fontSize:10, color:'#8b6914', marginBottom:12, textAlign:'center', letterSpacing:1 }}>VVPAT — SLIP VISIBLE FOR {vvpatCountdown}s</div>

                  <div style={{ fontSize:11, color:'#555' }}>{candidate.party}</div>
                </div>
              </div>
            </div>
          )}

      )}
      {evmState==='done' && !countingPhase && (
        <div className="fade-in" style={{ textAlign:'center' }}>
          <div className="card" style={{ maxWidth:400, margin:'0 auto 32px', borderColor:'var(--green)' }}>

            <div className="fade-in" style={{textAlign:'center'}}>

                  {candidates.map(c => (

                      <div style={{fontFamily:'Space Mono',fontSize:20,fontWeight:700,color:c.color}}>{tally[c.id]}</div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>{c.id}</div>
                    </div>

              </div>

function Confetti() {
  const colors=['#ff6b1a','#ffe135','#00c896','#4a9eff','#b06aff','#ff3b5c'];
  const pieces=Array.from({length:60},(_,i)=>({id:i,color:colors[i%colors.length],left:`${Math.random()*100}%`,delay:`${Math.random()*2}s`,duration:`${3+Math.random()*3}s`,size:`${6+Math.random()*8}px`,rotation:`${Math.random()*360}deg`}));
  return <>{pieces.map(p=><div key={p.id} className="confetti-piece" style={{left:p.left,top:'-20px',background:p.color,width:p.size,height:p.size,animationDuration:p.duration,animationDelay:p.delay,transform:`rotate(${p.rotation})`}}/>)}</>;
}

          <div className="cert-container" style={{marginBottom:32}}>
            <div style={{position:'absolute',inset:0,background:'radial-gradient(circle at 30% 20%,rgba(255,107,26,0.08) 0%,transparent 50%)',pointerEvents:'none'}}/>
            <div style={{display:'flex',height:6,borderRadius:3,overflow:'hidden',marginBottom:32}}><div style={{flex:1,background:'#ff9933'}}/><div style={{flex:1,background:'white'}}/><div style={{flex:1,background:'#138808'}}/></div>
            <div className="cert-seal">🗳️</div>
            <div style={{fontFamily:'Space Mono',fontSize:10,letterSpacing:3,color:'var(--muted)',marginBottom:12}}>CERTIFICATE OF COMPLETION</div>
            <div style={{fontFamily:'Syne',fontSize:14,fontWeight:600,color:'var(--muted)',marginBottom:8}}>This certifies that</div>
            <div style={{fontFamily:'Syne',fontSize:'clamp(28px,5vw,42px)',fontWeight:800,marginBottom:16,background:'linear-gradient(90deg,var(--saffron),var(--yellow))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>{name}</div>
            <div style={{fontFamily:'Plus Jakarta Sans',fontSize:15,color:'var(--muted)',marginBottom:24,lineHeight:1.7,maxWidth:420,margin:'0 auto 24px'}}>has successfully completed the <strong style={{color:'var(--paper)',display:'block',marginTop:4,fontSize:17}}>MatAdhikar: Election Process Educator</strong></div>
            <div style={{display:'flex',justifyContent:'center',gap:8,flexWrap:'wrap',marginBottom:28}}>
              {PHASES_META.map(p=><span key={p.id} style={{background:`${p.color}22`,border:`1px solid ${p.color}44`,color:p.color,borderRadius:999,padding:'4px 12px',fontSize:11,fontFamily:'Space Mono'}}>{p.emoji} {p.title}</span>)}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',paddingTop:24,borderTop:'1px solid var(--card-border)'}}>
              <div style={{textAlign:'left'}}><div style={{fontFamily:'Syne',fontSize:13,fontWeight:700,color:'var(--saffron)',marginBottom:4}}>MatAdhikar</div><div style={{fontFamily:'Space Mono',fontSize:10,color:'var(--muted)'}}>Powered by Gemini AI</div></div>
              <div style={{textAlign:'right'}}><div style={{fontFamily:'Space Mono',fontSize:10,color:'var(--muted)',marginBottom:4}}>DATE OF ISSUE</div><div style={{fontFamily:'Syne',fontSize:13,fontWeight:700}}>{today}</div></div>
            </div>
            <div style={{display:'flex',height:4,borderRadius:2,overflow:'hidden',marginTop:20}}><div style={{flex:1,background:'#ff9933'}}/><div style={{flex:1,background:'white'}}/><div style={{flex:1,background:'#138808'}}/></div>
          </div>
          <div style={{textAlign:'center'}}>
            <p style={{color:'var(--muted)',fontSize:13,marginBottom:16}}>🎉 You're officially a civic champion! Share your achievement.</p>
            <div style={{display:'flex',justifyContent:'center',gap:12}}>
              <button className="btn-primary" onClick={()=>window.print()}>🖨️ Print Certificate</button>
              <button className="btn-ghost" onClick={()=>{setSubmitted(false);setName('');}}>← Edit Name</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════
function App() {
  const [stage, setStage] = useState('landing');
  const [currentPhase, setCurrentPhase] = useState(1);
  const [completedPhases, setCompletedPhases] = useState([]);
  const [showViceCity, setShowViceCity] = useState(false);
  const [showCivicScore, setShowCivicScore] = useState(false);

  const handlePhaseComplete = (phaseId) => {
    if (!completedPhases.includes(phaseId)) setCompletedPhases(prev => [...prev, phaseId]);
    if (phaseId === 5) setStage('evm');
    else setCurrentPhase(phaseId + 1);
  };

  return (
    <div style={{ position: 'relative', zIndex: 1 }}>
      {/* ── VICE CITY MODAL ── */}
      {showViceCity && (
        <div className="modal-overlay" onClick={e => { if(e.target===e.currentTarget) setShowViceCity(false); }}>
          <div className="modal-inner" style={{maxWidth:720}}>
            <button className="modal-close" onClick={() => setShowViceCity(false)}>✕</button>
            <ViceCityGame onClose={() => setShowViceCity(false)} />
          </div>
        </div>
      )}

      {/* ── CIVIC SCORE MODAL ── */}
      {showCivicScore && (
        <div className="modal-overlay" onClick={e => { if(e.target===e.currentTarget) setShowCivicScore(false); }}>
          <div className="modal-inner" style={{maxWidth:640}}>
            <button className="modal-close" onClick={() => setShowCivicScore(false)}>✕</button>
            <CivicScoreCalc onClose={() => setShowCivicScore(false)} />
          </div>
        </div>
      )}

      {/* ── LANDING ── */}
      {stage === 'landing' && (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <TickerBanner />
          <div className="container" style={{ paddingTop: '60px', paddingBottom: '40px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '80px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <div style={{ width:36,height:36,borderRadius:'50%',background:'linear-gradient(135deg,#ff6b1a,#ffe135)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18 }}>🗳️</div>
                <span style={{ fontFamily:'Syne',fontWeight:800,fontSize:18,letterSpacing:'-0.5px' }}>MatAdhikar</span>
              </div>
              <span className="badge badge-saffron">BETA v1.0</span>
            </div>

            <div style={{ maxWidth: 700, marginBottom: '60px' }}>
              <div style={{ marginBottom: 20 }}>
                <span className="badge badge-green" style={{ marginBottom: 20, display: 'inline-flex' }}>✨ AI-POWERED CIVIC LEARNING</span>
              </div>
              <h1 className="hero-headline" style={{ marginBottom: 24 }}>
                Democracy is a<br />
                <span className="gradient-text">Vibe. Learn It.</span>
              </h1>
              <p style={{ fontSize: 18, color: '#aaa', lineHeight: 1.7, marginBottom: 40, maxWidth: 520 }}>
                5 phases. Real ECI guidelines. Zero boring textbooks.
                Master the Indian election process and earn your civic cert — powered by Gemini AI.
              </p>

              {/* ── HERO BUTTONS ROW 1 ── */}
              <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginBottom: 14 }}>
                <button className="btn-primary" style={{ fontSize: 16, padding: '16px 40px' }} onClick={() => setStage('learning')}>
                  Start Learning →
                </button>
                <button className="btn-ghost">Watch Demo ▶</button>
              </div>

              {/* ── HERO BUTTONS ROW 2 — NEW ── */}
              <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'center' }}>
                {/* Divider line */}
                <div style={{ width: '100%', height: 1, background: 'var(--card-border)', marginBottom: 2 }} />

                <button className="btn-vice-city" onClick={() => setShowViceCity(true)}>
                  <span style={{ fontSize: 16 }}>🎮</span>
                  <span>VOTE CITY — Story Mode</span>
                  <span style={{ fontSize: 10, background: '#ff6ec722', borderRadius: 4, padding: '2px 6px', color: '#ff6ec7', border: '1px solid #ff6ec755' }}>GTA STYLE</span>
                </button>

                <button className="btn-civic-score" onClick={() => setShowCivicScore(true)}>
                  <span style={{ fontSize: 16 }}>📊</span>
                  <span>My Civic Score</span>
                  <span style={{ fontSize: 10, background: '#00ffcc22', borderRadius: 4, padding: '2px 6px', color: '#00ffcc', border: '1px solid #00ffcc55' }}>AI POWERED</span>
                </button>
              </div>

              {/* Sub-labels */}
              <div style={{ display: 'flex', gap: 12, marginTop: 8, flexWrap: 'wrap' }}>
                <div style={{ fontSize: 11, color: 'var(--muted)', display: 'flex', alignItems: 'center', gap: 4, paddingLeft: 4 }}>
                  <span style={{ color: '#ff6ec7' }}>●</span> 4-chapter GTA-style election simulation with Gemini AI narration
                </div>
                <div style={{ fontSize: 11, color: 'var(--muted)', display: 'flex', alignItems: 'center', gap: 4 }}>
                  <span style={{ color: '#00ffcc' }}>●</span> 6-question civic awareness quiz with personalized AI debrief
                </div>
              </div>
            </div>

            {/* Phase Cards */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(160px,1fr))', gap: 12, marginBottom: '60px' }}>
              {PHASES_META.map((p, i) => (
                <div key={p.id} className="card" style={{ animationDelay:`${i*.1}s`, borderColor:'var(--card-border)', padding:'20px 16px', cursor:'default' }}>
                  <div style={{ fontSize:28, marginBottom:10 }}>{p.emoji}</div>
                  <div style={{ fontFamily:'Syne', fontWeight:700, fontSize:13, color:p.color, marginBottom:4 }}>Phase {p.id}</div>
                  <div style={{ fontSize:13, fontWeight:600, lineHeight:1.4 }}>{p.title}</div>
                </div>
              ))}
            </div>

            {/* Stats */}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16, marginBottom:40 }}>
              {[{num:"5",label:"Learning Phases"},{num:"AI",label:"Powered by Gemini"},{num:"1",label:"Epic Certificate"}].map((s,i)=>(
                <div key={i} style={{ textAlign:'center', padding:'24px 16px', borderRadius:16, border:'1px solid var(--card-border)', background:'var(--card-bg)' }}>
                  <div style={{ fontFamily:'Syne', fontSize:36, fontWeight:800, color:'var(--saffron)', marginBottom:8 }}>{s.num}</div>
                  <div style={{ fontSize:13, color:'var(--muted)' }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {stage === 'learning' && (
        <>
          <TickerBanner />
          <div className="container" style={{ paddingTop:40, paddingBottom:60 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:32 }}>
              <button onClick={() => setStage('landing')} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', fontSize:14, fontFamily:'Plus Jakarta Sans', display:'flex', alignItems:'center', gap:6 }}>← MatAdhikar</button>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <button className="btn-vice-city" style={{padding:'8px 16px',fontSize:10}} onClick={() => setShowViceCity(true)}>🎮 Story Mode</button>
                <button className="btn-civic-score" style={{padding:'8px 16px',fontSize:10}} onClick={() => setShowCivicScore(true)}>📊 My Score</button>
                <span className="badge badge-saffron">{completedPhases.length}/5 COMPLETE</span>
              </div>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'220px 1fr', gap:32, alignItems:'start' }}>
              <div><PhaseSidebar currentPhase={currentPhase} completedPhases={completedPhases} /></div>
              <div><LearningModule phase={currentPhase} onPhaseComplete={handlePhaseComplete} completedPhases={completedPhases} /></div>
            </div>
          </div>
        </>
      )}

      {stage === 'evm' && (
        <>
          <TickerBanner />
          <div className="container" style={{ paddingTop:40, paddingBottom:80 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:32 }}>
              <button onClick={() => setStage('learning')} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', fontSize:14, fontFamily:'Plus Jakarta Sans' }}>← Back</button>
              <span className="badge badge-green">ALL 5 PHASES COMPLETE ✅</span>
            </div>
            <EVMSimulator onComplete={() => setStage('certificate')} />
          </div>
        </>
      )}

      {stage === 'certificate' && (
        <>
          <TickerBanner />
          <div className="container" style={{ paddingTop:40, paddingBottom:80 }}>
            <div style={{ display:'flex', justifyContent:'flex-start', marginBottom:32 }}>
              <button onClick={() => setStage('evm')} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', fontSize:14, fontFamily:'Plus Jakarta Sans' }}>← Back to EVM</button>
            </div>
            <CertificateGenerator />
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
